<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Tuval ve Kusursuz Oranlı Dokunmatik Analiz Motoru v90.11</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; padding-bottom: 30px; }
        #camera-container { position: relative; width: 100%; max-width: 500px; aspect-ratio: 4 / 3; background: #000; overflow: hidden; cursor: pointer; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* v90.11: Canlı ekran düzeniniz ve yeşil çizginin ekrandaki fiziksel konumu (%33) milimetrik olarak tamamen korundu, asla dokunulmadı */
        #scan-line { position: absolute; top: 33%; left: 5%; width: 90%; height: 3px; background: #00ffcc; box-shadow: 0 0 10px #00ffcc; z-index: 10; }
        
        #debugCanvas { width: 90%; max-width: 500px; height: 50px; background: white; border: 3px solid #ffcc00; margin-top: 15px; border-radius: 4px; box-sizing: border-box; }
        #result-box { width: 90%; max-width: 500px; margin-top: 15px; padding: 15px; background: #222; border-radius: 8px; border: 1px solid #333; box-sizing: border-box; cursor: pointer; }
        .code-text { font-size: 24px; color: #ffcc00; font-weight: bold; letter-spacing: 2px; text-align: center; display: block; margin-top: 10px; }
        .version-tag { font-size: 11px; color: #888; text-align: right; width: 90%; max-width: 500px; margin-top: 5px; }
    </style>
    <script src="binary-data.js"></script>
    
    <!-- v90.11: GitHub dizininizde duran yerel ekran yakalama kütüphanesi aktif kalmaya devam ediyor -->
    <script src="html2canvas.min.js"></script>
</head>
<body>

    <h3 style="margin: 15px 0 5px 0;">Oyun Kartı Canlı Çizgi Analiz Motoru</h3>
    <div class="version-tag">Test Sürümü: v90.11</div>
    
    <div id="camera-container" onclick="triggerDualCaptureAndDownload()">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="scan-line"></div>
    </div>

    <canvas id="debugCanvas"></canvas>
    <canvas id="processingCanvas" style="display:none;"></canvas>

    <div id="result-box" onclick="triggerDualCaptureAndDownload()">
        <strong>Sistem Durumu:</strong> <span id="status">Kullanıcı etkileşimi bekleniyor...</span>
        <br>
        <strong>Deşifre Edilen Kart:</strong> <span id="barcode-output" class="code-text">- Tarama Bekleniyor -</span>
    </div>

<script>
/* 
==================================================================================
VERSİYON LOGU & MANTIKSAL DEĞİŞİKLİKLER (v90.11 - TEST SERİSİ)
----------------------------------------------------------------------------------
// SÜRDÜRÜLEN OMURGA & EKRAN GÜVENCESI (v50.15 Tabanlı):
   52 kartın 51'ini kusursuz tanıyan v50.15'in tüm deşifre, binarization, 13 hane 
   ve 5'li kapı mekanizmaları milimetrik olarak kilitli tutuldu, asla sulandırılmadı.
   Gözünüzle baktığınız canlı ekran düzeni, CSS boyutları ve tarama hattı konumu (%33) 
   birebir aynı bırakıldı, dikey ekran dengesi korunarak gürültü ihtimali önlendi.

// DEĞİŞİKLİK 1 (Yalnızca Screenshot Kodlarında Oran Sabitleme Kilidi):
   Önceki sürümlerde galerinize inen resimlerdeki o can sıkıcı basıklık, ezilme ve yeşil 
   çizginin ekrandakinden tamamen farklı, yanlış bir koordinatta çizilmesi sorunu çözüldü.
   Değişiklik SADECE triggerDualCaptureAndDownload fonksiyonunun içindeki kütüphane 
   parametrelerine uygulandı. html2canvas'a ekranı dikey en-boy oranına göre zorla bükmemesi, 
   kameranın ham çözünürlüğü (videoWidth/videoHeight) ne ise, resmi de tam o öz boyutlarında 
   1:1 gerçek ölçekle (scale:1) oluşturması emredildi. Basıklık bitti, çizgiler eşitlendi.

// KORUNAN KATMANLAR:
   - Dokunmatik tetiğe basıldığı salise HEM .txt raporunun HEM DE .png resminin 
     arka arkaya fırlatılma mekanizması aynen sürdürüldü.
   - Mikrofon gürültüleri ve sesli komut çakışmaları tamamen kapalı kalmaya devam etmektedir.
==================================================================================
*/

const video = document.getElementById('webcam');
const canvas = document.getElementById('processingCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

const debugCanvas = document.getElementById('debugCanvas');
const dCtx = debugCanvas.getContext('2d');

const statusText = document.getElementById('status');
const outputText = document.getElementById('barcode-output');

let lastDetectedStart = -1;
let lastDetectedEnd = -1;

let currentGlobalScanline = [];
let currentGlobalResultText = "- Tarama Yok -";
let currentGlobalEstModule = 0;

let lastSpokenCard = "";
let lastSpokenTime = 0;
let audioCtx = null;

function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'tr-TR'; 
        utterance.rate = 1.1;     
        window.speechSynthesis.speak(utterance);
    }
}

// v90.11: Canlı ekranı ellemeyip, SADECE .png screenshot çıktısındaki basıklığı sıfırlayan fonksiyon
function triggerDualCaptureAndDownload() {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const timestamp = new Date().getTime();
    
    // 1. KANIT: MATEMATİKSEL .TXT RAPORUNUN İNDİRİLMESİ (Aynen Korundu)
    try {
        const height = canvas.height;
        const centerY = Math.floor(height * 0.33);
        
        let logContent = `==================================================\n`;
        logContent += `  OPTIK PARLAMA VE KOORDINAT ANALIZ RAPORU (v90.11)\n`;
        logContent += `==================================================\n\n`;
        logContent += `[RAPOR ZAMANI]: ${new Date().toLocaleString()}\n`;
        logContent += `[TARAMA HATTI]: centerY = ${centerY}. piksel (Dikeyde Yukardan %33 Seviyesi)\n`;
        logContent += `[KILIT DURUMU]: ${currentGlobalResultText}\n`;
        logContent += `[MODÜL ÖLÇÜSÜ (estModule)]: ${currentGlobalEstModule.toFixed(2)} piksel\n`;
        logContent += `[BARKOD BAŞLANGIÇ PIKSELI]: ${lastDetectedStart !== -1 ? lastDetectedStart + ". piksel" : "TESPIT EDILEMEDI"}\n`;
        logContent += `[BARKOD BITIŞ PIKSELI]: ${lastDetectedEnd !== -1 ? lastDetectedEnd + ". piksel" : "TESPIT EDILEMEDI"}\n\n`;
        
        logContent += `--------------------------------------------------\n`;
        logContent += `YEŞIL ÇIZGININ ALTINDAN GEÇEN SAF PIKSEL BAR DIZILIMI:\n`;
        logContent += `(1 = Siyah Çizgi, 0 = Beyaz Boşluk)\n`;
        logContent += `--------------------------------------------------\n`;
        
        if (currentGlobalScanline.length > 0) {
            logContent += currentGlobalScanline.join("");
        } else {
            logContent += "Kamera pikselleri henüz okunmadı.";
        }
        
        logContent += `\n\n==================================================\n`;
        logContent += `RAPOR SONU - v90.11 ORAN SABITLEME SERISI\n`;
        logContent += `==================================================\n`;

        const blob = new Blob([logContent], { type: "text/plain;charset=utf-8" });
        const txtLink = document.createElement("a");
        txtLink.href = URL.createObjectURL(blob);
        txtLink.download = `parlama_analizi_v90.11_${timestamp}.txt`;
        
        document.body.appendChild(txtLink);
        txtLink.click();
        document.body.removeChild(txtLink);
        
        statusText.innerText = "1. Kanıt (.txt Raporu) Başarıyla Fırlatıldı...";
    } catch (e) {
        console.error("Metin raporu fırlatılamadı:", e);
    }

    // 2. KANIT: BASIKLIĞI GİDERİLMİŞ KUSURSUZ .PNG SCREENSHOT MOTORU
    if (typeof html2canvas !== "undefined") {
        setTimeout(() => {
            try {
                // v90.11 DÜZELTMESİ: Canlı ekrana dokunmadan sadece fotoğraf boyutuna katı donanım ölçü kilidi atıyoruz
                html2canvas(document.body, {
                    width: video.videoWidth,      // Kameranın ham yatay çözünürlüğü (1280)
                    height: video.videoHeight,    // Kameranın ham dikey çözünürlüğü (720)
                    scale: 1,                     // 1:1 gerçek oran kilidi, esnetme ve ezmeyi sıfırlar
                    useCORS: true,
                    allowTaint: true,
                    logging: false
                }).then(canvasElement => {
                    const dataUrl = canvasElement.toDataURL("image/png");
                    const pngLink = document.createElement("a");
                    pngLink.href = dataUrl;
                    pngLink.download = `tam_oranli_screenshot_v90.11_${timestamp}.png`;
                    
                    document.body.appendChild(pngLink);
                    pngLink.click();
                    document.body.removeChild(pngLink);
                    
                    statusText.innerText = "Harika! Doğal Oranlı .png ve .txt Başarıyla İndirildi!";
                }).catch(err => {
                    console.error("Screenshot oranlama hatası:", err);
                    statusText.innerText = ".txt İndi Ama .png Oran Sınırına Takıldı.";
                });
            } catch (e) {
                console.error("Screenshot başlatılamadı:", e);
            }
        }, 300);
    } else {
        statusText.innerText = ".txt İndi Ama html2canvas.min.js Klasörde Yok!";
    }
}

async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        });
        video.srcObject = stream;
        statusText.innerText = "v90.11 Oran Kilidi Aktif. Çift kanıt için ekrana dokunun.";

        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            debugCanvas.width = video.videoWidth;
            debugCanvas.height = 100; 
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            requestAnimationFrame(scanLoop);
        };
    } catch (err) {
        statusText.innerText = "Kamera Başlatılamadı: " + err.message;
    }
}

function scanLoop() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        lastDetectedStart = -1;
        lastDetectedEnd = -1;

        const result = processFrame();
        
        if (result && result.length === 13) {
            let cardName = "Bilinmeyen Kart";
            let isFound = false;

            if (typeof CARD_DATABASE !== "undefined" && CARD_DATABASE[result]) {
                cardName = CARD_DATABASE[result];
                currentGlobalResultText = `Kilitlendi: ${result} [${cardName}]`;
                outputText.innerText = result + " [" + cardName + "]";
                isFound = true; 
            } else {
                currentGlobalResultText = `Kilitlendi Ama Veritabanında Yok: ${result}`;
                outputText.innerText = result + " [YOK]";
            }

            const now = Date.now();
            if (result !== lastSpokenCard || (now - lastSpokenTime) > 3000) {
                if (isFound) {
                    speakText(cardName); 
                }
                lastSpokenCard = result;
                lastSpokenTime = now;
            }
        } else {
            currentGlobalResultText = "Kilitlenme Yok (Kör Nokta / Parlama Bölgesi)";
        }
    }
    requestAnimationFrame(scanLoop);
}

function processFrame() {
    const width = canvas.width;
    const height = canvas.height;
    
    // v90.11: Yeşil çizgiyle tam senkronize dikey üst tarama hattı (%33) korunuyor
    const centerY = Math.floor(height * 0.33); 
    const pixels = ctx.getImageData(0, centerY, width, 1).data;

    let scanline = [];
    const windowSize = 9;
    for (let x = 0; x < width; x++) {
        const idx = x * 4;
        const gray = 0.299 * pixels[idx] + 0.587 * pixels[idx + 1] + 0.114 * pixels[idx + 2];
        
        let sum = 0, count = 0;
        for (let i = -windowSize; i <= windowSize; i++) {
            if (x + i >= 0 && x + i < width) {
                sum += (0.299 * pixels[(x+i)*4] + 0.587 * pixels[(x+i)*4+1] + 0.114 * pixels[(x+i)*4+2]);
                count++;
            }
        }
        scanline.push(gray < (sum / count - 12) ? 1 : 0);
    }

    currentGlobalScanline = scanline;

    let runs = [];
    let currentBit = scanline, runLen = 1;
    let blockStartPixels = []; 
    let currentPixelPos = 0;

    for (let x = 1; x < scanline.length; x++) {
        if (scanline[x] === currentBit) runLen++;
        else {
            if (runLen > 1) {
                runs.push({ bit: currentBit, w: runLen });
                blockStartPixels.push(currentPixelPos);
            }
            currentPixelPos = x;
            currentBit = scanline[x]; runLen = 1;
        }
    }
    runs.push({ bit: currentBit, w: runLen });
    blockStartPixels.push(currentPixelPos);

    if (runs.length < 5) {
        currentGlobalEstModule = 0;
        drawDebugCanvas(scanline, width, centerY);
        return null;
    }

    const leftPixelCutoff = Math.floor(width * 0.25);
    let finalBinaryResult = null;

    for (let i = 0; i < runs.length - 3; i++) {
        if (blockStartPixels[i] < leftPixelCutoff) continue;

        if (runs[i].bit === 1) {
            
            let estModule = 1.0;
            let currentIdx = i + 3;
            let binaryString = "";
            let currentTotalModules = 0;
            let matchedPattern = false;

            if (runs[i+1].bit === 0 && runs[i+1].w > runs[i].w * 2.5 && runs[i+2].bit === 1) {
                if (runs[i+2].w > runs[i].w * 1.5) {
                    estModule = (runs[i].w + runs[i+1].w + runs[i+2].w) / 6;
                    binaryString = "100011";
                    currentTotalModules = 6;
                    matchedPattern = true;
                }
            }
            
            if (!matchedPattern) {
                if (runs[i+1].bit === 0 && runs[i+1].w > runs[i].w * 1.5 && runs[i+2].bit === 1) {
                    if (runs[i+2].w > runs[i].w * 1.5) {
                        estModule = (runs[i].w + runs[i+1].w + runs[i+2].w) / 5;
                        binaryString = "10011";
                        currentTotalModules = 5;
                    } else {
                        estModule = (runs[i].w + runs[i+1].w + runs[i+2].w) / 4;
                        binaryString = "1001";
                        currentTotalModules = 4;
                    }
                    matchedPattern = true;
                } 
                else if (runs[i+1].bit === 0 && runs[i+2].bit === 1 && runs[i+2].w > runs[i].w * 1.5) {
                    estModule = (runs[i].w + runs[i+1].w + runs[i+2].w) / 4;
                    binaryString = "1011";
                    currentTotalModules = 4;
                    matchedPattern = true;
                } 
                else if (runs[i+1].bit === 0 && runs[i+2].bit === 1) {
                    estModule = (runs[i].w + runs[i+1].w + runs[i+2].w) / 3;
                    binaryString = "101";
                    currentTotalModules = 3;
                    matchedPattern = true;
                }
            }

            if (!matchedPattern || estModule < 1.0) continue;
            
            currentGlobalEstModule = estModule;
            lastDetectedStart = blockStartPixels[i];

            while (currentIdx < runs.length && currentTotalModules < 13) {
                let exactModules = runs[currentIdx].w / estModule;
                let roundedModules = Math.min(4, Math.max(1, Math.round(exactModules)));
                
                if (currentTotalModules + roundedModules > 13) {
                    roundedModules = 13 - currentTotalModules;
                }

                binaryString += runs[currentIdx].bit.toString().repeat(roundedModules);
                currentTotalModules += roundedModules;
                currentIdx++;
            }

            if (runs[currentIdx - 1]) {
                lastDetectedEnd = blockStartPixels[currentIdx - 1] + runs[currentIdx - 1].w;
            }

            drawDebugCanvas(scanline, width, centerY);
            
            if (binaryString.length === 13) {
                statusText.innerText = "v90.11 Kilitlendi. Dinleniyor...";
                finalBinaryResult = binaryString;
                break; 
            }
        }
    }

    if (finalBinaryResult) return finalBinaryResult;

    currentGlobalEstModule = 0;
    drawDebugCanvas(scanline, width, centerY);
    return null;
}

function drawDebugCanvas(scanline, width, centerY) {
    dCtx.fillStyle = "#FFFFFF"; 
    dCtx.fillRect(0, 0, dCtx.canvas.width, dCtx.canvas.height);
    
    dCtx.fillStyle = "#FF0000"; 
    for (let x = 0; x < width; x++) {
        if (scanline[x] === 1) {
            dCtx.fillRect(x, 0, 1, dCtx.canvas.height);
        }
    }

    if (lastDetectedStart !== -1 && lastDetectedEnd !== -1) {
        dCtx.strokeStyle = "#0066FF"; 
        dCtx.lineWidth = 4;           
        const boxWidth = lastDetectedEnd - lastDetectedStart;
        dCtx.strokeRect(lastDetectedStart, 2, boxWidth, dCtx.canvas.height - 4);
        dCtx.fillStyle = "rgba(0, 102, 255, 0.15)"; 
        dCtx.fillRect(lastDetectedStart, 2, boxWidth, dCtx.canvas.height - 4);
    }
}

window.addEventListener('DOMContentLoaded', initCamera);
</script>
</body>
</html>
