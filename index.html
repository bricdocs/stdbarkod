<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Tuval Destekli Kart Okuyucu v50.4</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; padding-bottom: 30px; }
        #camera-container { position: relative; width: 100%; max-width: 500px; aspect-ratio: 4 / 3; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Tarama Çizgisi v50.3'teki gibi Eski Tam Genişliğinde (%90) Korundu */
        #scan-line { position: absolute; top: 50%; left: 5%; width: 90%; height: 3px; background: #00ffcc; box-shadow: 0 0 10px #00ffcc; z-index: 10; }
        
        /* Canlı Çizgi Analiz Tuvali */
        #debugCanvas { width: 90%; max-width: 500px; height: 50px; background: white; border: 3px solid #ffcc00; margin-top: 15px; border-radius: 4px; box-sizing: border-box; }
        
        #result-box { width: 90%; max-width: 500px; margin-top: 15px; padding: 15px; background: #222; border-radius: 8px; border: 1px solid #333; box-sizing: border-box; }
        .code-text { font-size: 24px; color: #ffcc00; font-weight: bold; letter-spacing: 2px; text-align: center; display: block; margin-top: 10px; }
        .version-tag { font-size: 11px; color: #888; text-align: right; width: 90%; max-width: 500px; margin-top: 5px; }
    </style>
</head>
<body>

    <h3 style="margin: 15px 0 5px 0;">Oyun Kartı Canlı Çizgi Analiz Motoru</h3>
    <div class="version-tag">Yazılım Sürümü: v50.4</div>
    
    <!-- Kamera Görünümü -->
    <div id="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="scan-line"></div>
    </div>

    <!-- Canlı Tuval Şeridi -->
    <canvas id="debugCanvas"></canvas>

    <!-- Arka plan piksellerinin işlendiği gizli tuval -->
    <canvas id="processingCanvas" style="display:none;"></canvas>

    <div id="result-box">
        <strong>Sistem Durumu:</strong> <span id="status">Başlatılıyor...</span>
        <br>
        <strong>Deşifre Edilen Saf Binary Kod:</strong> <span id="barcode-output" class="code-text">- Tarama Bekleniyor -</span>
    </div>

<script>
/* 
==================================================================================
VERSİYON LOGU & MANTIKSAL DEĞİŞİKLİKLER (v50.4)
----------------------------------------------------------------------------------
// DEĞİŞİKLİK 1 (v50.4 Kararlılık Testi): 
   Önceki sürümlerdeki esnek "ilk siyah çizgiden başlama" mantığı tamamen kaldırıldı. 
   EAN standardındaki katı "101" (Siyah-Beyaz-Siyah) başlangıç şablonu geri yüklendi. 

// DEĞİŞİKLİK 2 (Gürültü İmhası): 
   Algoritma artık tekil kenar gölgelerini veya harf uçlarını gördüğünde peşinde 
   "Beyaz-Siyah" (01) ritmi olmadığı için bunları parazit sayıp doğrudan atlar. 
   Yalnızca 1-0-1 dizilimini bulduğu milimetrik noktaya çapa atar.
==================================================================================
*/

const video = document.getElementById('webcam');
const canvas = document.getElementById('processingCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

const debugCanvas = document.getElementById('debugCanvas');
const dCtx = debugCanvas.getContext('2d');

const statusText = document.getElementById('status');
const outputText = document.getElementById('barcode-output');

async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { 
                facingMode: "environment",
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },
            audio: false
        });
        video.srcObject = stream;
        statusText.innerText = "v50.4 Aktif. 101 Araması Başlatıldı.";

        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            debugCanvas.width = video.videoWidth;
            debugCanvas.height = 100; 

            requestAnimationFrame(scanLoop);
        };
    } catch (err) {
        statusText.innerText = "Kamera Başlatılamadı: " + err.message;
    }
}

function scanLoop() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const result = processFrame();
        
        if (result && result.length === 13) {
            outputText.innerText = result; 
            if (navigator.vibrate) navigator.vibrate(150);
        }
    }
    requestAnimationFrame(scanLoop);
}

function processFrame() {
    const width = canvas.width;
    const height = canvas.height;
    const centerY = Math.floor(height / 2);
    const pixels = ctx.getImageData(0, centerY, width, 1).data;

    // 1. Adaptif Siyah/Beyaz Dönüşümü (v50.0 TANI SİSTEMİ BİREBİR AYNI)
    let scanline = [];
    const windowSize = 9;
    for (let x = 0; x < width; x++) {
        const idx = x * 4;
        const gray = 0.299 * pixels[idx] + 0.587 * pixels[idx + 1] + 0.114 * pixels[idx + 2];
        
        let sum = 0, count = 0;
        for (let i = -windowSize; i <= windowSize; i++) {
            if (x + i >= 0 && x + i < width) {
                sum += (0.299 * pixels[(x+i)*4] + 0.587 * pixels[(x+i)*4+1] + 0.114 * pixels[(x+i)*4+2]);
                count++;
            }
        }
        scanline.push(gray < (sum / count - 12) ? 1 : 0);
    }

    // -----------------------------------------------------------------
    // CANLI TUVAL ÇİZİMİ (v50.0 Kararlılığına Geri Döndü)
    // -----------------------------------------------------------------
    dCtx.fillStyle = "#FFFFFF"; 
    dCtx.fillRect(0, 0, debugCanvas.width, debugCanvas.height);
    
    dCtx.fillStyle = "#FF0000"; 
    for (let x = 0; x < width; x++) {
        if (scanline[x] === 1) {
            dCtx.fillRect(x, 0, 1, debugCanvas.height);
        }
    }
    // -----------------------------------------------------------------

    // 2. Çizgi Bloklarını Gruplama (Run-Length - v50.0 ile aynı)
    let runs = [];
    let currentBit = scanline[0], runLen = 1;
    for (let x = 1; x < scanline.length; x++) {
        if (scanline[x] === currentBit) runLen++;
        else {
            if (runLen > 1) runs.push({ bit: currentBit, w: runLen });
            currentBit = scanline[x]; runLen = 1;
        }
    }
    runs.push({ bit: currentBit, w: runLen });

    if (runs.length < 15) return null;

    // -----------------------------------------------------------------
    // 3. KATI 101 BAŞLANGIÇ KİLİTLEME MOTORU (v50.4 Kararlılık Revizyonu)
    // -----------------------------------------------------------------
    let startIndex = -1;
    let estModule = 1.0;

    for (let i = 0; i < runs.length - 14; i++) {
        // Katı 101 Kuralı: Siyah (1) - Beyaz (0) - Siyah (1) ardışıklığı şarttır
        if (runs[i].bit === 1 && runs[i+1].bit === 0 && runs[i+2].bit === 1) {
            
            // İlk 3 çizginin ortalamasından milimetrik 1 Modül piksel değerini türet
            const tempModule = (runs[i].w + runs[i+1].w + runs[i+2].w) / 3;
            if (tempModule < 1.0) continue;

            // Sahte kenar gölgelerini elemakiçin genişlik doğrulaması (%70 tolerans)
            const errorLimit = tempModule * 0.7;
            if (Math.abs(runs[i].w - tempModule) > errorLimit || 
                Math.abs(runs[i+1].w - tempModule) > errorLimit || 
                Math.abs(runs[i+2].w - tempModule) > errorLimit) {
                continue; 
            }

            // Gerçek 101 noktası doğrulandı, çapa atılıyor
            startIndex = i;
            estModule = tempModule;
            break;
        }
    }

    if (startIndex === -1) return null;

    let binaryString = "101"; // Kod 101 ile başlatıldı
    let currentIdx = startIndex + 3; // 101'den sonraki blokla devam et
    let currentTotalModules = 3;

    // Kalan 10 modülü sırayla deşifre ederek toplam 13 modüle tamamla
    while (currentIdx < runs.length && currentTotalModules < 13) {
        let exactModules = runs[currentIdx].w / estModule;
        let roundedModules = Math.min(4, Math.max(1, Math.round(exactModules)));
        
        if (currentTotalModules + roundedModules > 13) {
            roundedModules = 13 - currentTotalModules;
        }

        binaryString += runs[currentIdx].bit.toString().repeat(roundedModules);
        currentTotalModules += roundedModules;
        currentIdx++;
    }

    if (binaryString.length === 13) {
        statusText.innerText = "v50.4 Kilitlendi.";
        return binaryString;
    }

    return null;
}

window.addEventListener('DOMContentLoaded', initCamera);
</script>
</body>
</html>
