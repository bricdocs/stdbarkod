<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Tuval ve Dinamik Blok Kilitlemeli Analiz Motoru v90.16</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; padding-bottom: 30px; }
        #camera-container { position: relative; width: 100%; max-width: 500px; aspect-ratio: 4 / 3; background: #000; overflow: hidden; cursor: pointer; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* v90.16: Yeşil tarama çizgisi %33 kararlı dikey test konumunda sımsıkı kalmaya devam ediyor */
        #scan-line { position: absolute; top: 33%; left: 5%; width: 90%; height: 3px; background: #00ffcc; box-shadow: 0 0 10px #00ffcc; z-index: 10; }
        
        #debugCanvas { width: 90%; max-width: 500px; height: 50px; background: white; border: 3px solid #ffcc00; margin-top: 15px; border-radius: 4px; box-sizing: border-box; }
        #result-box { width: 90%; max-width: 500px; margin-top: 15px; padding: 15px; background: #222; border-radius: 8px; border: 1px solid #333; box-sizing: border-box; cursor: pointer; }
        .code-text { font-size: 24px; color: #ffcc00; font-weight: bold; letter-spacing: 2px; text-align: center; display: block; margin-top: 10px; }
        .version-tag { font-size: 11px; color: #888; text-align: right; width: 90%; max-width: 500px; margin-top: 5px; }
        
        .recording-active { color: #ff3333 !important; animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.4; } }
    </style>
    <script src="binary-data.js"></script>
    <script src="html2canvas.min.js"></script>
</head>
<body>

    <h3 style="margin: 15px 0 5px 0;">Oyun Kartı Canlı Çizgi Analiz Motoru</h3>
    <div class="version-tag">Test Sürümü: v90.16</div>
    
    <div id="camera-container" onclick="handleLoggingToggle()">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="scan-line"></div>
    </div>

    <canvas id="debugCanvas"></canvas>
    <canvas id="processingCanvas" style="display:none;"></canvas>

    <div id="result-box" onclick="handleLoggingToggle()">
        <strong>Sistem Durumu:</strong> <span id="status">v90.16 Hazır. Röntgen kaydını BAŞLATMAK için ekrana dokunun.</span>
        <br>
        <strong>Deşifre Edilen Kart:</strong> <span id="barcode-output" class="code-text">- Tarama Bekleniyor -</span>
    </div>

<script>
/* 
==================================================================================
VERSİYON LOGU & MANTIKSAL DEĞİŞİKLİKLER (v90.16 - DİNAMİK BLOK TAMİRİ)
----------------------------------------------------------------------------------
// ADIM ADIM SAF TAMİRAT (Dinamik Kapı Kontrollü Blok Kilidi):
   v90.15'teki sabit 10 blok kuralının Kupa Papazı (HK) ve diğer geniş kapılarda 
   yarattığı "Tarama Bekleniyor" donma hatası tamamen çözüldü. Sistemin başlangıçta 
   yuttuğu kapı modül sayısına göre geriye kalan hedef fiziksel blok sayısı otomatik 
   olarak dinamik kilit altına alındı (101 için 10, 1001 için 9, 101011/100011 için 7).
   Ayrıca döngüden çıkan kodun son bitinin "1" olması şartı (barkod bitiş kuralı) 
   askeri bir doğrulama kalkanı olarak entegre edildi.

// SÜRDÜRÜLEN OMURGA & LOG ALTYAPISI:
   v50.15 tanı motoru yapısı, %33 tarama çizgisi konumu ve v90.13 çift dokunuşlu 
   küsurat röntgen log düzeneği milimetrik olarak aynen korunmuştur.
==================================================================================
*/

const video = document.getElementById('webcam');
const canvas = document.getElementById('processingCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

const debugCanvas = document.getElementById('debugCanvas');
const dCtx = debugCanvas.getContext('2d');

const statusText = document.getElementById('status');
const outputText = document.getElementById('barcode-output');

let lastDetectedStart = -1;
let lastDetectedEnd = -1;

let lastSpokenCard = "";
let lastSpokenTime = 0;
let audioCtx = null;

window.cardLogBuffer = [];
let isLoggingActive = false;
let loggedFrameCount = 0;
let lastDetectedCardNameInSession = "YOK"; 

let currentGlobalScanline = [];
let currentGlobalResultText = "Kilitlenme Yok";
let currentGlobalEstModule = 0;
let currentGlobalRoundXRay = "- Akış Yok -";

function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const finalUtterance = window.SpeechSynthesisUtterance ? new window.SpeechSynthesisUtterance(text) : new SpeechSynthesisUtterance(text);
        finalUtterance.lang = 'tr-TR'; 
        finalUtterance.rate = 1.1;     
        window.speechSynthesis.speak(finalUtterance);
    }
}

function handleLoggingToggle() {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    if (!isLoggingActive) {
        window.cardLogBuffer = []; 
        loggedFrameCount = 0;
        lastDetectedCardNameInSession = "YOK"; 
        isLoggingActive = true;
        statusText.innerText = "KAYIT BAŞLADI... [Kare: 0]";
        statusText.classList.add("recording-active");
    } else {
        isLoggingActive = false;
        statusText.classList.remove("recording-active");
        statusText.innerText = "Kayıt Durduruldu. Rapor Hazırlanıyor...";
        if (loggedFrameCount > 0) {
            downloadLogBuffer();
        } else {
            statusText.innerText = "Kaydedilmiş kare bulunamadı! Yeni kayıt için dokunun.";
        }
    }
}

function downloadLogBuffer() {
    try {
        let logContent = `====================================================================\n`;
        logContent += `  DİNAMİK BLOK KİLİTLEMELİ SAF YUVARLAMA RAPORU (v90.16)\n`;
        logContent += `====================================================================\n\n`;
        logContent += `[KAYIT TARİHİ]: ${new Date().toLocaleString()}\n`;
        logContent += `[TOPLAM KAYDEDİLEN KARE]: ${loggedFrameCount} Kare (Yaklaşık ${Math.round(loggedFrameCount/30)} Saniye)\n`;
        logContent += `[OTOMATİK SEANS SONUCU]: ${lastDetectedCardNameInSession}\n`;
        logContent += `[TARAMA HATTI KOORDİNATI]: centerY = ${Math.floor(canvas.height * 0.33)}. piksel\n\n`;
        logContent += `--------------------------------------------------------------------\n`;
        logContent += `HANE SANIYE TARİHÇESİ (Dinamik Blok Sayacı ve Son Bit Kontrol Detayı):\n`;
        logContent += `--------------------------------------------------------------------\n\n`;

        logContent += window.cardLogBuffer.join("\n\n");

        logContent += `\n\n====================================================================\n`;
        logContent += `RAPOR SONU - DİNAMİK BLOKLAR KİLİTLENDİ - BELLEK TEMİZLENDİ\n`;
        logContent += `====================================================================\n`;

        const blob = new Blob([logContent], { type: "text/plain;charset=utf-8" });
        const downloadLink = document.createElement("a");
        downloadLink.href = URL.createObjectURL(blob);
        
        const timestamp = new Date().getTime();
        const safeFileName = lastDetectedCardNameInSession.replace(/\s+/g, '_');
        downloadLink.download = `${safeFileName}_Dinamik_Blok_${loggedFrameCount}Kare_${timestamp}.txt`;
        
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        
        window.cardLogBuffer = [];
        statusText.innerText = "Dinamik Röntgen Raporu İndi. Yeni Seans İçin Tekrar Dokunun.";
    } catch (e) {
        console.error("Rapor fırlatılamadı:", e);
        statusText.innerText = "Rapor İndirme Hatası!";
    }
}

async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        });
        video.srcObject = stream;
        statusText.innerText = "v90.16 Röntgen Motoru Hazır. Kayıt için ekrana dokunun.";

        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            debugCanvas.width = video.videoWidth;
            debugCanvas.height = 100; 
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            requestAnimationFrame(scanLoop);
        };
    } catch (err) {
        statusText.innerText = "Kamera Başlatılamadı: " + err.message;
    }
}

function scanLoop() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        lastDetectedStart = -1;
        lastDetectedEnd = -1;
        currentGlobalRoundXRay = "- Akış Kaydedilmedi -";

        const result = processFrame();
        
        if (result && result.length === 13) {
            let cardName = "Bilinmeyen Kart";
            let isFound = false;

            if (typeof CARD_DATABASE !== "undefined" && CARD_DATABASE[result]) {
                cardName = CARD_DATABASE[result];
                currentGlobalResultText = `Kilitlendi: ${result} [${cardName}]`;
                outputText.innerText = result + " [" + cardName + "]";
                isFound = true; 
                if (isLoggingActive) {
                    lastDetectedCardNameInSession = cardName;
                }
            } else {
                currentGlobalResultText = `Kilitlendi Ama Sözlükte Yok: ${result}`;
                outputText.innerText = result + " [YOK]";
            }

            const now = Date.now();
            if (result !== lastSpokenCard || (now - lastSpokenTime) > 3000) {
                if (isFound) {
                    speakText(cardName); 
                }
                lastSpokenCard = result;
                lastSpokenTime = now;
            }
        } else {
            currentGlobalResultText = "Kilitlenme Yok (Kör Nokta / Yuvarlama Sapması)";
        }

        if (isLoggingActive) {
            loggedFrameCount++;
            statusText.innerText = `RÖNTGEN YAZILIYOR... [Kare: ${loggedFrameCount}]`;
            
            let frameLog = `[KARE #${loggedFrameCount}] [DURUM]: ${currentGlobalResultText} | estModule: ${currentGlobalEstModule.toFixed(2)}px | Start: ${lastDetectedStart} | End: ${lastDetectedEnd}\n`;
            frameLog += `[YUVARLAMA RÖNTGENİ (13 Bit Kümülâtif Akışı)]:\n${currentGlobalRoundXRay}\n`;
            frameLog += `[SAF BINARY DIZILIM]: ${currentGlobalScanline.join("")}`;
            
            window.cardLogBuffer.push(frameLog);
        }
    }
    requestAnimationFrame(scanLoop);
}

function processFrame() {
    const width = canvas.width;
    const height = canvas.height;
    const centerY = Math.floor(height * 0.33); 
    const pixels = ctx.getImageData(0, centerY, width, 1).data;

    let scanline = [];
    const windowSize = 9;
    for (let x = 0; x < width; x++) {
        const idx = x * 4;
        const gray = 0.299 * pixels[idx] + 0.587 * pixels[idx + 1] + 0.114 * pixels[idx + 2];
        
        let sum = 0, count = 0;
        for (let i = -windowSize; i <= windowSize; i++) {
            if (x + i >= 0 && x + i < width) {
                sum += (0.299 * pixels[(x+i)*4] + 0.587 * pixels[(x+i)*4+1] + 0.114 * pixels[(x+i)*4+2]);
                count++;
            }
        }
        scanline.push(gray < (sum / count - 12) ? 1 : 0);
    }

    currentGlobalScanline = scanline;

    let runs = [];
    let currentBit = scanline, runLen = 1;
    let blockStartPixels = []; 
    let currentPixelPos = 0;

    for (let x = 1; x < scanline.length; x++) {
        if (scanline[x] === currentBit) runLen++;
        else {
            if (runLen > 1) {
                runs.push({ bit: currentBit, w: runLen });
                blockStartPixels.push(currentPixelPos);
            }
            currentPixelPos = x;
            currentBit = scanline[x]; runLen = 1;
        }
    }
    runs.push({ bit: currentBit, w: runLen });
    blockStartPixels.push(currentPixelPos);

    if (runs.length < 5) {
        currentGlobalEstModule = 0;
        drawDebugCanvas(scanline, width, centerY);
        return null;
    }

    const leftPixelCutoff = Math.floor(width * 0.25);
    let finalBinaryResult = null;

    for (let i = 0; i < runs.length - 3; i++) {
        if (blockStartPixels[i] < leftPixelCutoff) continue;

        if (runs[i].bit === 1) {
            
            let estModule = 1.0;
            let currentIdx = i + 3;
            let binaryString = "";
            let currentTotalModules = 0;
            let matchedPattern = false;

            if (runs[i+1].bit === 0 && runs[i+1].w > runs[i].w * 2.5 && runs[i+2].bit === 1) {
                if (runs[i+2].w > runs[i].w * 1.5) {
                    estModule = (runs[i].w + runs[i+1].w + runs[i+2].w) / 6;
                    binaryString = "100011";
                    currentTotalModules = 6;
                    matchedPattern = true;
                }
            }
            
            if (!matchedPattern) {
                if (runs[i+1].bit === 0 && runs[i+1].w > runs[i].w * 1.5 && runs[i+2].bit === 1) {
                    if (runs[i+2].w > runs[i].w * 1.5) {
                        estModule = (runs[i].w + runs[i+1].w + runs[i+2].w) / 5;
                        binaryString = "10011";
                        currentTotalModules = 5;
                    } else {
                        estModule = (runs[i].w + runs[i+1].w + runs[i+2].w) / 4;
                        binaryString = "1001";
                        currentTotalModules = 4;
                    }
                    matchedPattern = true;
                } 
                else if (runs[i+1].bit === 0 && runs[i+2].bit === 1 && runs[i+2].w > runs[i].w * 1.5) {
                    estModule = (runs[i].w + runs[i+1].w + runs[i+2].w) / 4;
                    binaryString = "1011";
                    currentTotalModules = 4;
                    matchedPattern = true;
                } 
                else if (runs[i+1].bit === 0 && runs[i+2].bit === 1) {
                    estModule = (runs[i].w + runs[i+1].w + runs[i+2].w) / 3;
                    binaryString = "101";
                    currentTotalModules = 3;
                    matchedPattern = true;
                }
            }

            if (!matchedPattern || estModule < 1.0) continue;
            
            currentGlobalEstModule = estModule;
            lastDetectedStart = blockStartPixels[i];

            // v90.16: Giriş kapısının karakteristiğine göre hedef bağımsız blok sayısı kilitleniyor
            let targetBlocksCount = 10; // Klasik 101 kapısı için (3 hane başlangıç + 10 blok = 13)
            if (binaryString === "1001") targetBlocksCount = 9;     // 4 hane başlangıç + 9 blok = 13
            if (binaryString === "10011") targetBlocksCount = 8;    // 5 hane başlangıç + 8 blok = 13
            if (binaryString === "100011") targetBlocksCount = 7;   // 6 hane başlangıç + 7 blok = 13
            if (binaryString === "1011") targetBlocksCount = 9;     // 4 hane başlangıç + 9 blok = 13

            let xrayTrace = []; 
            let accumulatedModules = currentTotalModules; 
            let processedBlocksCount = 0;

            xrayTrace.push(`  -> Başlangıç Kapısı Birikimi: ${accumulatedModules.toFixed(2)} birim (Şablon: ${binaryString}) | Hedef Blok Sayısı: ${targetBlocksCount}`);

            while (currentIdx < runs.length && processedBlocksCount < targetBlocksCount) {
                let exactModules = runs[currentIdx].w / estModule;
                let roundedModules = Math.min(4, Math.max(1, Math.round(exactModules)));
                
                accumulatedModules += exactModules;
                
                xrayTrace.push(`  -> Blok #${currentIdx} [Bit: ${runs[currentIdx].bit} | Genişlik: ${runs[currentIdx].w}px]: Oran = ${exactModules.toFixed(2)} | Kümülâtif Birikim = ${accumulatedModules.toFixed(2)} birim`);

                binaryString += runs[currentIdx].bit.toString().repeat(roundedModules);
                currentIdx++;
                processedBlocksCount++;
            }

            currentGlobalRoundXRay = xrayTrace.join("\n");

            // ASKERİ DOĞRULAMA: Dinamik blok sayısı hedefe ulaşmadıysa VEYA harf uzunluğu 
            // tam 13 değilse VEYA barkodun son biti "1" ile mühürlenmediyse kod dizilimini İMHA ET!
            if (processedBlocksCount !== targetBlocksCount || binaryString.length !== 13 || binaryString.charAt(12) !== "1") {
                binaryString = ""; 
            }

            if (runs[currentIdx - 1] && binaryString.length === 13) {
                lastDetectedEnd = blockStartPixels[currentIdx - 1] + runs[currentIdx - 1].w;
            }

            drawDebugCanvas(scanline, width, centerY);
            
            if (binaryString.length === 13) {
                statusText.innerText = "v90.16 Kilitlendi. Dinleniyor...";
                finalBinaryResult = binaryString;
                break; 
            }
        }
    }

    if (finalBinaryResult) return finalBinaryResult;

    currentGlobalEstModule = 0;
    drawDebugCanvas(scanline, width, centerY);
    return null;
}

function drawDebugCanvas(scanline, width, centerY) {
    dCtx.fillStyle = "#FFFFFF"; 
    dCtx.fillRect(0, 0, dCtx.canvas.width, dCtx.canvas.height);
    
    dCtx.fillStyle = "#FF0000"; 
    for (let x = 0; x < width; x++) {
        if (scanline[x] === 1) {
            dCtx.fillRect(x, 0, 1, dCtx.canvas.height);
        }
    }

    if (lastDetectedStart !== -1 && lastDetectedEnd !== -1) {
        dCtx.strokeStyle = "#0066FF"; 
        dCtx.lineWidth = 4;           
        const boxWidth = lastDetectedEnd - lastDetectedStart;
        dCtx.strokeRect(lastDetectedStart, 2, boxWidth, dCtx.canvas.height - 4);
        dCtx.fillStyle = "rgba(0, 102, 255, 0.15)"; 
        dCtx.fillRect(lastDetectedStart, 2, boxWidth, dCtx.canvas.height - 4);
    }
}

window.addEventListener('DOMContentLoaded', initCamera);
</script>
</body>
</html>
