<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Tuval ve Ses Destekli Kart Okuyucu v50.14</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; padding-bottom: 30px; }
        #camera-container { position: relative; width: 100%; max-width: 500px; aspect-ratio: 4 / 3; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #scan-line { position: absolute; top: 50%; left: 5%; width: 90%; height: 3px; background: #00ffcc; box-shadow: 0 0 10px #00ffcc; z-index: 10; }
        #debugCanvas { width: 90%; max-width: 500px; height: 50px; background: white; border: 3px solid #ffcc00; margin-top: 15px; border-radius: 4px; box-sizing: border-box; }
        #result-box { width: 90%; max-width: 500px; margin-top: 15px; padding: 15px; background: #222; border-radius: 8px; border: 1px solid #333; box-sizing: border-box; }
        .code-text { font-size: 24px; color: #ffcc00; font-weight: bold; letter-spacing: 2px; text-align: center; display: block; margin-top: 10px; }
        .version-tag { font-size: 11px; color: #888; text-align: right; width: 90%; max-width: 500px; margin-top: 5px; }
    </style>
    <script src="binary-data.js"></script>
</head>
<body>

    <h3 style="margin: 15px 0 5px 0;">Oyun Kartı Canlı Çizgi Analiz Motoru</h3>
    <div class="version-tag">Yazılım Sürümü: v50.14</div>
    
    <div id="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="scan-line"></div>
    </div>

    <canvas id="debugCanvas"></canvas>
    <canvas id="processingCanvas" style="display:none;"></canvas>

    <div id="result-box">
        <strong>Sistem Durumu:</strong> <span id="status">Kullanıcı etkileşimi bekleniyor...</span>
        <br>
        <strong>Deşifre Edilen Kart:</strong> <span id="barcode-output" class="code-text">- Tarama Bekleniyor -</span>
    </div>

<script>
/* 
==================================================================================
VERSİYON LOGU & MANTIKSAL DEĞİŞİKLİKLER (v50.14)
----------------------------------------------------------------------------------
// DEĞİŞİKLİK 1 (10011 Başlangıç Desteği - Dördüncü Anahtar Kapısı):
   v50.13'ün ana omurgasına (görüntü işleme, 13 digit sayacı, sol kırpma, vb.) milimetrik 
   olarak dokunulmadan sadece talep ettiğiniz başlangıç süzgeci genişletildi. 
   101'e 1011 eklediğimiz kararlı mantığın birebir aynısı uygulanarak; algoritma 
   1001 yapısını bulduğunda eğer 3. siyah blok (i+2) kalınsa (yani peşinden bir 1 
   daha geliyorsa) bunu 10011 olarak doğrular. Oran kalibrasyonunu (estModule) 
   5 modül üzerinden kusursuzca kurup 13 bitlik ana omurgaya senkronize eder.

// DEĞİŞİKLİK 2 (Titreşim ve Bip Kapalı Statüsü Korundu):
   Titreşim komutu (commentli) ve bip sesinin kapalılık kararlılığı aynen sürdürüldü.
==================================================================================
*/

const video = document.getElementById('webcam');
const canvas = document.getElementById('processingCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

const debugCanvas = document.getElementById('debugCanvas');
const dCtx = debugCanvas.getContext('2d');

const statusText = document.getElementById('status');
const outputText = document.getElementById('barcode-output');

let lastDetectedStart = -1;
let lastDetectedEnd = -1;

let lastSpokenCard = "";
let lastSpokenTime = 0;

let audioCtx = null;
function playBip() {
    // Bip sesi kapalı
}

function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'tr-TR'; 
        utterance.rate = 1.1;     
        window.speechSynthesis.speak(utterance);
    }
}

async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        });
        video.srcObject = stream;
        statusText.innerText = "v50.14 Aktif. Başlamak için ekrana bir kez dokunun.";

        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            debugCanvas.width = video.videoWidth;
            debugCanvas.height = 100; 
            requestAnimationFrame(scanLoop);
        };
    } catch (err) {
        statusText.innerText = "Kamera Başlatılamadı: " + err.message;
    }
}

function scanLoop() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        lastDetectedStart = -1;
        lastDetectedEnd = -1;

        const result = processFrame();
        
        if (result && result.length === 13) {
            let cardName = "Bilinmeyen Kart";
            let isFound = false;

            if (typeof CARD_DATABASE !== "undefined" && CARD_DATABASE[result]) {
                cardName = CARD_DATABASE[result];
                outputText.innerText = result + " [" + cardName + "]";
                isFound = true; 
            } else {
                outputText.innerText = result + " [YOK]";
            }

            const now = Date.now();
            if (result !== lastSpokenCard || (now - lastSpokenTime) > 3000) {
                if (isFound) {
                    speakText(cardName); 
                }
                lastSpokenCard = result;
                lastSpokenTime = now;
            }
            // if (navigator.vibrate) navigator.vibrate(150);
        }
    }
    requestAnimationFrame(scanLoop);
}

function processFrame() {
    const width = canvas.width;
    const height = canvas.height;
    const centerY = Math.floor(height / 2);
    const pixels = ctx.getImageData(0, centerY, width, 1).data;

    let scanline = [];
    const windowSize = 9;
    for (let x = 0; x < width; x++) {
        const idx = x * 4;
        const gray = 0.299 * pixels[idx] + 0.587 * pixels[idx + 1] + 0.114 * pixels[idx + 2];
        
        let sum = 0, count = 0;
        for (let i = -windowSize; i <= windowSize; i++) {
            if (x + i >= 0 && x + i < width) {
                sum += (0.299 * pixels[(x+i)*4] + 0.587 * pixels[(x+i)*4+1] + 0.114 * pixels[(x+i)*4+2]);
                count++;
            }
        }
        scanline.push(gray < (sum / count - 12) ? 1 : 0);
    }

    let runs = [];
    let currentBit = scanline, runLen = 1;
    let blockStartPixels = []; 
    let currentPixelPos = 0;

    for (let x = 1; x < scanline.length; x++) {
        if (scanline[x] === currentBit) runLen++;
        else {
            if (runLen > 1) {
                runs.push({ bit: currentBit, w: runLen });
                blockStartPixels.push(currentPixelPos);
            }
            currentPixelPos = x;
            currentBit = scanline[x]; runLen = 1;
        }
    }
    runs.push({ bit: currentBit, w: runLen });
    blockStartPixels.push(currentPixelPos);

    if (runs.length < 5) {
        drawDebugCanvas(scanline, width);
        return null;
    }

    const leftPixelCutoff = Math.floor(width * 0.25);
    let finalBinaryResult = null;

    for (let i = 0; i < runs.length - 3; i++) {
        if (blockStartPixels[i] < leftPixelCutoff) continue;

        if (runs[i].bit === 1) {
            
            let estModule = 1.0;
            let currentIdx = i + 3;
            let binaryString = "";
            let currentTotalModules = 0;
            let matchedPattern = false;

            // ÇOKLU BAŞLANGIÇ SÜZGEÇ KAPILARI
            if (runs[i+1].bit === 0 && runs[i+1].w > runs[i].w * 1.5 && runs[i+2].bit === 1) {
                
                // Sizin bahsettiğiniz 10011 kontrolü: 3. blok kalınsa 10011'dir
                if (runs[i+2].w > runs[i].w * 1.5) {
                    estModule = (runs[i].w + runs[i+1].w + runs[i+2].w) / 5;
                    binaryString = "10011";
                    currentTotalModules = 5;
                } else {
                    estModule = (runs[i].w + runs[i+1].w + runs[i+2].w) / 4;
                    binaryString = "1001";
                    currentTotalModules = 4;
                }
                matchedPattern = true;
            } 
            else if (runs[i+1].bit === 0 && runs[i+2].bit === 1 && runs[i+2].w > runs[i].w * 1.5) {
                estModule = (runs[i].w + runs[i+1].w + runs[i+2].w) / 4;
                binaryString = "1011";
                currentTotalModules = 4;
                matchedPattern = true;
            } 
            else if (runs[i+1].bit === 0 && runs[i+2].bit === 1) {
                estModule = (runs[i].w + runs[i+1].w + runs[i+2].w) / 3;
                binaryString = "101";
                currentTotalModules = 3;
                matchedPattern = true;
            }

            if (!matchedPattern || estModule < 1.0) continue;
            
            lastDetectedStart = blockStartPixels[i];

            while (currentIdx < runs.length && currentTotalModules < 13) {
                let exactModules = runs[currentIdx].w / estModule;
                let roundedModules = Math.min(4, Math.max(1, Math.round(exactModules)));
                
                if (currentTotalModules + roundedModules > 13) {
                    roundedModules = 13 - currentTotalModules;
                }

                binaryString += runs[currentIdx].bit.toString().repeat(roundedModules);
                currentTotalModules += roundedModules;
                currentIdx++;
            }

            if (runs[currentIdx - 1]) {
                lastDetectedEnd = blockStartPixels[currentIdx - 1] + runs[currentIdx - 1].w;
            }

            drawDebugCanvas(scanline, width);
            
            if (binaryString.length === 13) {
                statusText.innerText = "v50.14 Kilitlendi. Dinleniyor...";
                finalBinaryResult = binaryString;
                break; 
            }
        }
    }

    if (finalBinaryResult) return finalBinaryResult;

    drawDebugCanvas(scanline, width);
    return null;
}

function drawDebugCanvas(scanline, width) {
    dCtx.fillStyle = "#FFFFFF"; 
    dCtx.fillRect(0, 0, debugCanvas.width, debugCanvas.height);
    
    dCtx.fillStyle = "#FF0000"; 
    for (let x = 0; x < width; x++) {
        if (scanline[x] === 1) {
            dCtx.fillRect(x, 0, 1, debugCanvas.height);
        }
    }

    if (lastDetectedStart !== -1 && lastDetectedEnd !== -1) {
        dCtx.strokeStyle = "#0066FF"; 
        dCtx.lineWidth = 4;           
        const boxWidth = lastDetectedEnd - lastDetectedStart;
        dCtx.strokeRect(lastDetectedStart, 2, boxWidth, debugCanvas.height - 4);
        dCtx.fillStyle = "rgba(0, 102, 255, 0.15)"; 
        dCtx.fillRect(lastDetectedStart, 2, boxWidth, debugCanvas.height - 4);
    }
}

window.addEventListener('click', () => {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    statusText.innerText = "v50.14 Ses Motoru Hazır. Taranıyor...";
});

window.addEventListener('DOMContentLoaded', initCamera);
</script>
</body>
</html>
